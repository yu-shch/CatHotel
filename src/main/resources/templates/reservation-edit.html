<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約内容の編集</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen">

<header class="bg-white border-b border-amber-100 shadow-sm">
    <div class="max-w-4xl mx-auto px-6 py-5 flex items-center justify-between">
        <div>
            <h1 class="text-xl font-bold text-slate-900">予約内容の編集</h1>
            <p class="text-xs text-slate-500 mt-0.5">Cat Hotel 管理ページ</p>
        </div>

        <a th:href="@{/admin/reservations}"
           class="inline-flex items-center rounded-full border border-slate-300 bg-white px-4 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition">
            ← 予約一覧へ戻る
        </a>
    </div>
</header>

<main class="max-w-2xl mx-auto px-6 py-10">

    <div th:if="${editError}"
         class="mb-6 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-medium text-rose-700">
        <p th:text="${editError}"></p>
    </div>

    <div class="bg-white rounded-3xl shadow-sm border border-amber-100 overflow-hidden">
        <div class="bg-slate-50/80 px-7 py-6 border-b border-slate-100">
            <div class="flex items-center justify-between mb-4">
                <span class="text-xs font-bold tracking-wider text-slate-400">お客様情報（変更不可）</span>
                <span class="inline-flex items-center rounded-full bg-amber-100 px-3 py-1 text-xs font-bold text-amber-800"
                      th:text="${reservation.reservationCode}">
                    RES-000
                </span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-sm">
                <div>
                    <p class="text-xs text-slate-400">飼い主さま</p>
                    <p class="font-semibold text-slate-800 mt-0.5" th:text="${reservation.ownerName}">山田 花子</p>
                </div>
                <div>
                    <p class="text-xs text-slate-400">電話番号</p>
                    <p class="font-semibold text-slate-800 mt-0.5" th:text="${reservation.phone}">090-0000-0000</p>
                </div>
                <div>
                    <p class="text-xs text-slate-400">メールアドレス</p>
                    <p class="font-semibold text-slate-800 mt-0.5 break-all" th:text="${reservation.email}">test@example.com</p>
                </div>
            </div>
        </div>

        <form th:action="@{/admin/reservations/update}" method="post" class="p-7 space-y-5 text-sm">
            <input type="hidden" name="id" th:value="${reservation.id}">

            <div>
                <label for="catName" class="block text-xs font-bold text-slate-700 mb-1.5">
                    猫ちゃんのお名前 <span class="text-rose-500">*</span>
                </label>
                <input type="text" id="catName" name="catName" required
                       th:value="${reservation.catName}"
                       class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-400/40 focus:border-amber-500 transition">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="checkInDate" class="block text-xs font-bold text-slate-700 mb-1.5">
                        チェックイン日 <span class="text-rose-500">*</span>
                    </label>
                    <input type="date" id="checkInDate" name="checkInDate" required
                           th:value="${reservation.checkInDate}"
                           class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-400/40 focus:border-amber-500 transition">
                </div>

                <div>
                    <label for="checkOutDate" class="block text-xs font-bold text-slate-700 mb-1.5">
                        チェックアウト日 <span class="text-rose-500">*</span>
                    </label>
                    <input type="date" id="checkOutDate" name="checkOutDate" required
                           th:value="${reservation.checkOutDate}"
                           class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-400/40 focus:border-amber-500 transition">
                </div>
            </div>

            <div>
                <label for="roomType" class="block text-xs font-bold text-slate-700 mb-1.5">
                    お部屋タイプ <span class="text-rose-500">*</span>
                </label>
                <select id="roomType" name="roomType" required
                        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-400/40 focus:border-amber-500 transition">
                    <option value="スタンダードルーム"
                            th:selected="${reservation.roomType == 'スタンダードルーム'}">
                        スタンダードルーム
                    </option>
                    <option value="ファミリー2匹ルーム"
                            th:selected="${reservation.roomType == 'ファミリー2匹ルーム'}">
                        ファミリー2匹ルーム
                    </option>
                    <option value="サンシャイン・ラグジュアリールーム"
                            th:selected="${reservation.roomType == 'サンシャイン・ラグジュアリールーム'}">
                        サンシャイン・ラグジュアリールーム
                    </option>
                </select>
            </div>

            <div>
                <label for="noteText" class="block text-xs font-bold text-slate-700 mb-1.5">
                    備考（投薬・アレルギー・ご要望など）
                </label>
                <textarea id="noteText" name="noteText" rows="4"
                          th:text="${reservation.noteText}"
                          placeholder="特記事項があれば入力してください"
                          class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-400/40 focus:border-amber-500 transition"></textarea>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                <a th:href="@{/admin/reservations}"
                   class="rounded-full border border-slate-300 px-6 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">
                    キャンセル
                </a>
                <button type="submit"
                        class="rounded-full bg-amber-500 px-7 py-2.5 text-xs font-bold text-white hover:bg-amber-600 shadow-xs transition cursor-pointer">
                    変更を保存する
                </button>
            </div>
        </form>
    </div>
</main>

</body>
</html>
